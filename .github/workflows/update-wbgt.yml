name: Update WBGT data

on:
  # GitHub内側のcronは公開リポで頻繁にスキップされるので保険扱い（1時間毎）。
  # メインの起動経路は cron-job.org などの外部サービスからの workflow_dispatch。
  schedule:
    # GitHub仕様上の最短間隔 = 5分。高頻度でもスキップされるのは変わらないが、
    # 発火チャンスを最大化する目的で最短にする。
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # 外部cronから短い間隔で叩かれた時、前の実行が走っていたらキューせず破棄
      group: update-wbgt
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch WBGT data
        run: python scripts/fetch_wbgt.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wbgt/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update WBGT $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          fi
