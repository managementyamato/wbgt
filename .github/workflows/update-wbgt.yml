name: Update WBGT data

on:
  schedule:
    # 10分毎に実行（GitHub Actions の cron skip 耐性を高めるため高頻度化）
    # XX:00 は全世界で負荷ピーク → skip 多いのでそこを避けて 5分ずらし
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:   # 手動実行用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-wbgt
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch WBGT data
        run: python scripts/fetch_wbgt.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/wbgt/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update WBGT $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
