<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲンバルジャー ウィジェット プレビュー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    header {
      background: #16213e;
      padding: 16px 24px;
      border-bottom: 2px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 1.4rem; color: #e94560; letter-spacing: 2px; }
    header span { font-size: 0.85rem; color: #64748b; }
    .server-note {
      margin-left: auto;
      font-size: 0.75rem;
      color: #f59e0b;
      background: rgba(245,158,11,0.1);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(245,158,11,0.3);
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 20px;
      padding: 24px;
    }
    .widget-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      overflow: hidden;
    }
    .widget-card.wide { grid-column: 1 / -1; }
    .card-header {
      background: #0f3460;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header h2 { font-size: 0.95rem; color: #e0e0e0; }
    .badge {
      font-size: 0.7rem;
      background: #e94560;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .preview-frame {
      width: 100%;
      height: 400px;
      border: none;
      display: block;
      background: #000;
    }
    .config-panel {
      background: #0d0d1a;
      padding: 12px 16px;
      border-top: 1px solid #0f3460;
    }
    .config-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .config-field { display: flex; flex-direction: column; gap: 4px; }
    .config-field label { font-size: 0.72rem; color: #94a3b8; }
    .config-field input,
    .config-field select {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .config-field input[type="text"],
    .config-field input[type="date"],
    .config-field input[type="number"] { min-width: 160px; }
    .btn {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn:hover { background: #c73652; }
    .note { font-size: 0.72rem; color: #475569; margin-top: 6px; }
    #loading {
      text-align: center;
      padding: 60px;
      color: #64748b;
      font-size: 0.9rem;
    }
    #error-msg {
      display: none;
      margin: 24px;
      padding: 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      color: #fca5a5;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    /* ---- Yodeck 環境シミュレーター ---- */
    #yodeck-sim {
      margin: 16px 24px 0;
      background: #0d1f0d;
      border: 1px solid #1a4a1a;
      border-radius: 8px;
      overflow: hidden;
    }
    #yodeck-sim .sim-header {
      background: #1a3a1a;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    #yodeck-sim .sim-header h2 {
      font-size: 0.85rem;
      color: #4ade80;
      flex: 1;
    }
    #yodeck-sim .sim-header .sim-status {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #14532d;
      color: #86efac;
    }
    #yodeck-sim .sim-header .sim-status.offline {
      background: #450a0a;
      color: #fca5a5;
    }
    #yodeck-sim .sim-body {
      padding: 12px 16px;
      border-top: 1px solid #1a4a1a;
    }
    #yodeck-sim .sim-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    #yodeck-sim .sim-field { display: flex; flex-direction: column; gap: 4px; }
    #yodeck-sim .sim-field label { font-size: 0.72rem; color: #86efac; }
    #yodeck-sim .sim-field select,
    #yodeck-sim .sim-field input {
      background: #1a1a2e;
      border: 1px solid #1a4a1a;
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    #yodeck-sim .sim-result {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.7;
    }
    #yodeck-sim .sim-result .ok   { color: #4ade80; }
    #yodeck-sim .sim-result .fail { color: #f87171; }
    .btn-sim {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-sim:hover { background: #15803d; }
    .btn-sim-test {
      background: #0369a1;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-sim-test:hover { background: #075985; }
    .btn-sim-addr {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-sim-addr:hover { background: #6d28d9; }
    .btn-sim-addr:disabled { background: #4b5563; cursor: wait; }
  </style>
</head>
<body>

<header>
  <h1>ゲンバルジャー</h1>
  <span>Yodeck ウィジェット ローカルプレビュー</span>
  <span class="server-note">起動: python mock_server.py</span>
</header>

<!-- ======= Yodeck 環境シミュレーター ======= -->
<div id="yodeck-sim">
  <div class="sim-header" onclick="toggleSim()">
    <h2>🍓 Yodeck 環境シミュレーター（GPS モック）</h2>
    <span id="sim-status" class="sim-status offline">mock_server.py 未起動</span>
    <span style="font-size:0.75rem;color:#86efac" id="sim-toggle-label">▼ 開く</span>
  </div>
  <div class="sim-body" id="sim-body" style="display:none">
    <!-- 住所検索 -->
    <div class="sim-row" style="margin-bottom:10px">
      <div class="sim-field" style="flex:1;min-width:240px">
        <label>住所を入力（例: 大阪府大阪市北区梅田1丁目）</label>
        <input type="text" id="sim-address" placeholder="住所・建物名・地名など"
          style="width:100%" onkeydown="if(event.key==='Enter')geocodeAddress()">
      </div>
      <div class="sim-field" style="justify-content:flex-end">
        <button class="btn-sim-addr" id="btn-geocode" onclick="geocodeAddress()">📍 住所から検索</button>
      </div>
    </div>
    <div class="sim-row">
      <div class="sim-field">
        <label>都市プリセット</label>
        <select id="sim-preset" onchange="applyPreset()">
          <option value="">── カスタム ──</option>
          <option value="43.0608,141.3544,札幌">札幌</option>
          <option value="38.2667,140.8667,仙台">仙台</option>
          <option value="35.8617,139.6453,さいたま">さいたま</option>
          <option value="35.6895,139.6917,東京" selected>東京</option>
          <option value="35.4500,139.6500,横浜">横浜</option>
          <option value="35.1667,136.9667,名古屋">名古屋</option>
          <option value="35.0167,135.7333,京都">京都</option>
          <option value="34.6833,135.5167,大阪">大阪</option>
          <option value="34.6913,135.1830,神戸">神戸</option>
          <option value="33.5833,130.3833,福岡">福岡</option>
          <option value="26.2167,127.6833,那覇">那覇</option>
        </select>
      </div>
      <div class="sim-field">
        <label>緯度 (lat)</label>
        <input type="number" id="sim-lat" value="35.6895" step="0.0001" style="width:120px">
      </div>
      <div class="sim-field">
        <label>経度 (lon)</label>
        <input type="number" id="sim-lon" value="139.6917" step="0.0001" style="width:120px">
      </div>
      <div class="sim-field" style="justify-content:flex-end">
        <button class="btn-sim" onclick="setLocation()">GPS位置を適用</button>
      </div>
      <div class="sim-field" style="justify-content:flex-end">
        <button class="btn-sim-test" onclick="testDevice()">接続テスト</button>
      </div>
    </div>
    <div id="sim-result" class="sim-result">
      ← 「接続テスト」で mock_server.py の動作確認ができます
    </div>
    <p style="font-size:0.72rem;color:#475569;margin-top:8px">
      ⚠ <code>python -m http.server 8080</code> ではなく <code>python mock_server.py</code> で起動してください
    </p>
  </div>
</div>

<div id="error-msg"></div>
<div id="loading">ウィジェット一覧を読み込み中...</div>
<div id="grid"></div>

<script>
// ===== Yodeck 環境シミュレーター =========================================

var _simOpen = false;

function toggleSim() {
  _simOpen = !_simOpen;
  document.getElementById('sim-body').style.display = _simOpen ? 'block' : 'none';
  document.getElementById('sim-toggle-label').textContent = _simOpen ? '▲ 閉じる' : '▼ 開く';
  if (_simOpen) testDevice();
}

function geocodeAddress() {
  var address = document.getElementById('sim-address').value.trim();
  if (!address) { alert('住所を入力してください'); return; }

  var btn = document.getElementById('btn-geocode');
  btn.disabled = true;
  btn.textContent = '検索中…';
  setSimResult('住所を検索中: ' + address);

  var url = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(address);
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(results) {
      btn.disabled = false;
      btn.textContent = '📍 住所から検索';

      if (!results || results.length === 0) {
        setSimResult('<span class="fail">❌ 住所が見つかりませんでした。別の表記で試してください。</span>');
        return;
      }

      // GeoJSON: coordinates = [lon, lat]
      var best = results[0];
      var lon = best.geometry.coordinates[0];
      var lat = best.geometry.coordinates[1];
      var title = best.properties.title || address;

      document.getElementById('sim-lat').value = lat.toFixed(6);
      document.getElementById('sim-lon').value = lon.toFixed(6);
      document.getElementById('sim-preset').value = '';

      // 候補が複数あれば一覧表示
      var candidatesHtml = '';
      if (results.length > 1) {
        candidatesHtml = '<br>他の候補: ';
        var max = Math.min(results.length, 4);
        for (var i = 1; i < max; i++) {
          var r = results[i];
          var rLon = r.geometry.coordinates[0];
          var rLat = r.geometry.coordinates[1];
          var rTitle = r.properties.title || '';
          candidatesHtml += '<a href="#" style="color:#93c5fd" onclick="pickCandidate(' +
            rLat.toFixed(6) + ',' + rLon.toFixed(6) + ',\'' + rTitle.replace(/'/g,'') + '\');return false">' +
            rTitle + '</a> ';
        }
      }

      setSimResult(
        '<span class="ok">✅ 住所を解決しました</span><br>' +
        '📍 <strong>' + title + '</strong><br>' +
        'lat=' + lat.toFixed(6) + ', lon=' + lon.toFixed(6) + '<br>' +
        candidatesHtml +
        '<br><button class="btn-sim" style="margin-top:6px" onclick="setLocation()">この位置でGPSを適用</button>'
      );
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = '📍 住所から検索';
      setSimResult('<span class="fail">❌ 国土地理院APIへの接続に失敗しました。ネットワークを確認してください。</span>');
    });
}

function pickCandidate(lat, lon, title) {
  document.getElementById('sim-lat').value = lat;
  document.getElementById('sim-lon').value = lon;
  setSimResult(
    '<span class="ok">✅ 候補を選択しました</span><br>' +
    '📍 <strong>' + title + '</strong><br>' +
    'lat=' + lat + ', lon=' + lon + '<br>' +
    '<button class="btn-sim" style="margin-top:6px" onclick="setLocation()">この位置でGPSを適用</button>'
  );
}

function applyPreset() {
  var val = document.getElementById('sim-preset').value;
  if (!val) return;
  var parts = val.split(',');
  document.getElementById('sim-lat').value = parts[0];
  document.getElementById('sim-lon').value = parts[1];
}

function setLocation() {
  var lat = parseFloat(document.getElementById('sim-lat').value);
  var lon = parseFloat(document.getElementById('sim-lon').value);
  var preset = document.getElementById('sim-preset');
  var name = preset.value ? preset.options[preset.selectedIndex].text : '';
  if (isNaN(lat) || isNaN(lon)) { alert('緯度・経度を正しく入力してください'); return; }

  fetch('http://localhost:8080/set-location', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lat: lat, lon: lon, name: name })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.ok) {
      setSimResult('<span class="ok">✅ GPS位置を更新しました → lat=' + lat + ', lon=' + lon + (name ? '（' + name + '）' : '') + '</span><br>ウィジェットの次回更新（約15分）で反映されます。すぐ確認したい場合はページをリロードしてください。');
      updateSimStatus(true);
    }
  })
  .catch(function() {
    setSimResult('<span class="fail">❌ mock_server.py に接続できません。<br>コマンドプロンプトで <code>python mock_server.py</code> を実行してください。</span>');
    updateSimStatus(false);
  });
}

function testDevice() {
  fetch('http://localhost:8080/device')
  .then(function(r) { return r.json(); })
  .then(function(d) {
    var loc = Array.isArray(d.location) ? d.location : [d.lat || d.latitude, d.lon || d.lng || d.longitude];
    var lat = loc[0], lon = loc[1];
    setSimResult(
      '<span class="ok">✅ mock_server.py 起動中</span><br>' +
      '現在のGPS位置: <strong>lat=' + lat + ', lon=' + lon + '</strong><br>' +
      'デバイス名: ' + (d.name || '不明')
    );
    document.getElementById('sim-lat').value = lat;
    document.getElementById('sim-lon').value = lon;
    updateSimStatus(true);
  })
  .catch(function() {
    setSimResult('<span class="fail">❌ mock_server.py 未起動<br>以下を実行してからページをリロードしてください：<br><code>cd C:/Claude/ゲンバルジャー大元 &amp;&amp; python mock_server.py</code></span>');
    updateSimStatus(false);
  });
}

function setSimResult(html) {
  document.getElementById('sim-result').innerHTML = html;
}

function updateSimStatus(online) {
  var el = document.getElementById('sim-status');
  if (online) {
    el.textContent = '✅ 稼働中';
    el.className = 'sim-status';
  } else {
    el.textContent = 'mock_server.py 未起動';
    el.className = 'sim-status offline';
  }
}

// ページ読み込み時にサーバー状態を確認
window.addEventListener('load', function() {
  fetch('http://localhost:8080/device').then(function() { updateSimStatus(true); }).catch(function() {});
});

// ===== ウィジェットごとの設定UI定義 =====================================
// 新しいウィジェットを追加する場合、ここにIDと一致するエントリを追加する。
// 定義がないウィジェットは設定なしのカードとして表示される。

var WIDGET_CONFIGS = {
  'musaigai': {
    frameHeight: 400,
    fields: [
      { id: 'startday', label: '起算日 (startDay)', type: 'date' },
      { id: 'target',   label: '目標日数',          type: 'number', value: '365', style: 'width:80px' }
    ],
    note: '※ Yodeck上ではwidget_api.jsがinit_widgetを自動呼び出しします',
    apply: function(widgetId) {
      var startDay = document.getElementById(widgetId + '-startday').value;
      var target   = parseInt(document.getElementById(widgetId + '-target').value) || 365;
      if (!startDay) { alert('起算日を入力してください'); return; }
      sendConfig(widgetId, {
        startDay: startDay, target_days: target,
        font_size: 'large', background_color: 'yellow'
      });
    }
  },
  'digital-clock': {
    frameHeight: 300,
    fields: [
      { id: 'timeFormat', label: '時刻フォーマット', type: 'select', options: [{v:'HH:MM:SS',l:'HH:MM:SS（秒あり）',selected:true},{v:'HH:MM',l:'HH:MM（秒なし）'}] },
      { id: 'showDate',   label: '日付表示',         type: 'select', options: [{v:'1',l:'表示する',selected:true},{v:'0',l:'非表示'}] },
      { id: 'fontFamily', label: 'フォント',         type: 'select', options: [{v:'keifont, sans-serif',l:'けいフォント',selected:true},{v:'Arial, sans-serif',l:'Arial'},{v:'Impact, sans-serif',l:'Impact'}] },
      { id: 'fontColor',  label: '文字色',           type: 'select', options: [{v:'#ffffff',l:'白',selected:true},{v:'#d9d9d9',l:'ライトグレー'},{v:'#000000',l:'黒'},{v:'#ffff00',l:'黄'},{v:'#00ff00',l:'緑'},{v:'#00bfff',l:'水色'},{v:'#ff8c00',l:'オレンジ'}] },
      { id: 'bgColor',    label: '背景色',           type: 'select', options: [{v:'#000000',l:'黒',selected:true},{v:'#ffffff',l:'白'},{v:'#1a1a2e',l:'ダークネイビー'},{v:'#003366',l:'ネイビー'},{v:'transparent',l:'透明'}] },
      { id: 'bold',       label: '太字',             type: 'select', options: [{v:'0',l:'なし',selected:true},{v:'1',l:'太字'}] },
      { id: 'fontSize',   label: 'フォントサイズ',   type: 'select', options: [{v:'auto',l:'自動',selected:true},{v:'48',l:'48px'},{v:'64',l:'64px'},{v:'96',l:'96px'},{v:'128',l:'128px'},{v:'192',l:'192px'}] }
    ],
    apply: function(widgetId) {
      sendConfig(widgetId, {
        timeFormat: document.getElementById(widgetId + '-timeFormat').value,
        showDate:   document.getElementById(widgetId + '-showDate').value,
        fontFamily: document.getElementById(widgetId + '-fontFamily').value,
        fontColor:  document.getElementById(widgetId + '-fontColor').value,
        bgColor:    document.getElementById(widgetId + '-bgColor').value,
        bold:       document.getElementById(widgetId + '-bold').value,
        fontSize:   document.getElementById(widgetId + '-fontSize').value
      });
    }
  },
  'analog-clock': {
    frameHeight: 400,
    fields: [
      { id: 'style',           label: 'スタイル',      type: 'select', options: [{v:'classic',l:'クラシック',selected:true},{v:'minimal',l:'シンプル'}] },
      { id: 'showSeconds',     label: '秒針',          type: 'select', options: [{v:'1',l:'表示する',selected:true},{v:'0',l:'非表示'}] },
      { id: 'showNumbers',     label: '数字表示',      type: 'select', options: [{v:'1',l:'表示する',selected:true},{v:'0',l:'非表示'}] },
      { id: 'faceColor',       label: '文字盤色',         type: 'select', options: [{v:'#ffffff',l:'白',selected:true},{v:'#000000',l:'黒'},{v:'#1a1a2e',l:'ダークネイビー'},{v:'#003366',l:'ネイビー'},{v:'#f5f0e8',l:'クリーム'}] },
      { id: 'handColor',       label: '針の色（時・分）', type: 'select', options: [{v:'#000000',l:'黒',selected:true},{v:'#ffffff',l:'白'},{v:'#d9d9d9',l:'ライトグレー'},{v:'#003366',l:'ネイビー'},{v:'#333333',l:'ダークグレー'}] },
      { id: 'secondHandColor', label: '秒針の色',         type: 'select', options: [{v:'#ff0000',l:'赤',selected:true},{v:'#ff8c00',l:'オレンジ'},{v:'#ffffff',l:'白'},{v:'#000000',l:'黒'}] },
      { id: 'bgColor',         label: '背景色',           type: 'select', options: [{v:'#1a1a2e',l:'ダークネイビー',selected:true},{v:'#000000',l:'黒'},{v:'#ffffff',l:'白'},{v:'transparent',l:'透明'}] }
    ],
    apply: function(widgetId) {
      sendConfig(widgetId, {
        style:           document.getElementById(widgetId + '-style').value,
        showSeconds:     document.getElementById(widgetId + '-showSeconds').value,
        showNumbers:     document.getElementById(widgetId + '-showNumbers').value,
        faceColor:       document.getElementById(widgetId + '-faceColor').value,
        handColor:       document.getElementById(widgetId + '-handColor').value,
        secondHandColor: document.getElementById(widgetId + '-secondHandColor').value,

      });
    }
  },
  'scroll-text': {
    frameHeight: 120,
    wide: true,
    fields: [
      { id: 'text',       label: '表示テキスト', type: 'text',   value: '現場の安全を最優先に！　本日も無事故・無災害を目指しましょう。', style: 'min-width:300px' },

// ===== Yodeck postMessage送信 ============================================

function sendConfig(widgetId, config) {
  var frame = document.getElementById('frame-' + widgetId);
  if (!frame) return;
  frame.contentWindow.postMessage({
    functions: [{ fname: 'init_widget', data: config }]
  }, '*');
}

// ===== フィールドHTML生成 ===============================================

function buildField(widgetId, field) {
  var id = widgetId + '-' + field.id;
  var style = field.style ? ' style="' + field.style + '"' : '';
  var html = '<div class="config-field"><label for="' + id + '">' + field.label + '</label>';

  if (field.type === 'select') {
    html += '<select id="' + id + '"' + style + '>';
    field.options.forEach(function(opt) {
      html += '<option value="' + opt.v + '"' + (opt.selected ? ' selected' : '') + '>' + opt.l + '</option>';
    });
    html += '</select>';
  } else {
    var value = field.value ? ' value="' + field.value + '"' : '';
    html += '<input type="' + field.type + '" id="' + id + '"' + value + style + '>';
  }
  return html + '</div>';
}

// ===== ウィジェットカードHTML生成 ========================================

function buildCard(widget) {
  var cfg = WIDGET_CONFIGS[widget.id] || {};
  var height = cfg.frameHeight || 400;
  var wideClass = cfg.wide ? ' wide' : '';

  var html = '<div class="widget-card' + wideClass + '">';
  html += '<div class="card-header"><h2>' + widget.name + '</h2><span class="badge">' + widget.id + '</span></div>';
  html += '<iframe id="frame-' + widget.id + '" class="preview-frame" style="height:' + height + 'px" src="widgets/' + widget.id + '/index.html"></iframe>';
  html += '<div class="config-panel">';

  if (cfg.fields && cfg.fields.length > 0) {
    html += '<div class="config-row">';
    cfg.fields.forEach(function(field) {
      html += buildField(widget.id, field);
    });
    html += '<div class="config-field" style="justify-content:flex-end"><button class="btn" onclick="WIDGET_CONFIGS[\'' + widget.id + '\'].apply(\'' + widget.id + '\')">適用</button></div>';
    html += '</div>';
  }

  if (cfg.note) html += '<p class="note">' + cfg.note + '</p>';
  if (widget.details && !cfg.note) html += '<p class="note">' + widget.details + '</p>';

  html += '</div></div>';
  return html;
}

// ===== manifest.json を読み込んでカードを生成 ============================

fetch('widgets/manifest.json')
  .then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(function(widgets) {
    document.getElementById('loading').style.display = 'none';
    var grid = document.getElementById('grid');
    widgets.forEach(function(widget) {
      grid.innerHTML += buildCard(widget);
    });

    // 起算日のデフォルトを今日に設定
    var startdayEl = document.getElementById('musaigai-startday');
    if (startdayEl) {
      startdayEl.value = new Date().toISOString().split('T')[0];
    }
  })
  .catch(function(err) {
    document.getElementById('loading').style.display = 'none';
    var errEl = document.getElementById('error-msg');
    errEl.style.display = 'block';
    errEl.innerHTML = [
      '<strong>manifest.json の読み込みに失敗しました</strong>',
      'ローカルサーバーが起動していない可能性があります。',
      '',
      '以下のコマンドでサーバーを起動してから、このページを開いてください：',
      '<code style="display:block;margin-top:8px;padding:8px;background:#1a1a2e;border-radius:4px">cd C:/Claude/ゲンバルジャー大元 &amp;&amp; python -m http.server 8080</code>',
      '<code style="display:block;margin-top:4px;padding:8px;background:#1a1a2e;border-radius:4px">→ http://localhost:8080/preview.html</code>',
      '',
      '新しいウィジェットを追加したら <code>./build.sh</code> を実行してmanifest.jsonを更新してください。'
    ].join('<br>');
  });
