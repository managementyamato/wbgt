<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ウィジェット名</title>
  <style>
    /* ===== フォント ===================================================== */
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.ttf");
      /* fonts/keifont.ttf を他のウィジェットからコピーして使用してください */
    }

    /* ===== リセット ===================================================== */
    * {
      -webkit-box-sizing: border-box;
         -moz-box-sizing: border-box;
              box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
      font-style: normal;
      font-weight: normal;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* ===== レイアウト =================================================== */
    .wrap {
      display: inline-block;
      width: 100%;
      height: auto;
    }

    .container {
      display: inline-block;
      width: 100%;
      height: 100vh;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* ===== ヘッダー ===================================================== */
    .hdr {
      display: block;
      width: 100%;
      background-color: #1a56db; /* テーマカラーを変更 */
      font-family: "keifont", sans-serif;
      font-size: 90pt;           /* pt推奨（解像度非依存） */
      color: #ffffff;
      text-align: center;
      letter-spacing: 4px;
      margin: 0;
      line-height: 1;
      overflow: hidden;
    }

    /* ===== コンテンツエリア ============================================= */
    .content {
      padding: 2%;
      background-color: #f5f5f5;
    }

    .value-display {
      font-family: "keifont", sans-serif;
      font-size: 120pt;          /* pt推奨 */
      color: #1a1a1a;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="container">
    <h2 class="hdr" id="widget_title">ウィジェット名</h2>
    <div class="content">
      <div class="value-display" id="main_value">--</div>
    </div>
  </div>
</div>

<!-- widget_init.js を先に読み込む（init_widget定義 + postMessageリスナー） -->
<script src="js/widget_init.js"></script>
<!-- main.js でウィジェット固有のロジックを実装 -->
<script src="js/main.js"></script>

</body>
</html>
