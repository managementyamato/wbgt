<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゲンバルジャー 座標ピッカー</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; background: #1a1a2e; color: #e0e0e0; }
    header {
      background: #16213e;
      padding: 12px 20px;
      border-bottom: 2px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 1.2rem; color: #e94560; letter-spacing: 1px; }
    header .sub { font-size: 0.85rem; color: #9bb0c9; }

    #main {
      display: flex;
      height: calc(100% - 54px);
    }
    #map { flex: 1; }
    #panel {
      width: 360px;
      background: #0f1f3a;
      padding: 20px;
      overflow-y: auto;
      border-left: 1px solid #0f3460;
    }

    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #e0e0e0;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .search-box button {
      padding: 8px 14px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .search-box button:hover { background: #ff5773; }

    .coord-card {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .coord-label {
      font-size: 0.75rem;
      color: #9bb0c9;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .coord-value-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .coord-value {
      flex: 1;
      font-size: 1.3rem;
      font-weight: 600;
      color: #44ccff;
      font-family: 'Consolas', 'Menlo', monospace;
      user-select: all;
    }
    .copy-btn {
      padding: 6px 12px;
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .copy-btn:hover { background: #1a4a80; }
    .copy-btn.copied { background: #2ecc71; }

    .combo {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .combo-label {
      font-size: 0.75rem;
      color: #9bb0c9;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .combo-value {
      font-size: 1rem;
      color: #ffd84d;
      font-family: 'Consolas', 'Menlo', monospace;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .address {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      color: #c9d3e0;
      min-height: 2.5em;
    }
    .address-label {
      font-size: 0.72rem;
      color: #9bb0c9;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hint {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: #f5cf8a;
      line-height: 1.5;
      margin-top: 16px;
    }
    .hint strong { color: #ffd84d; }

    .leaflet-container { background: #0d1a2e; }
  </style>
</head>
<body>
  <header>
    <h1>🎯 座標ピッカー</h1>
    <span class="sub">地図をクリック／検索で現場の緯度経度を取得、Yodeckの位置設定欄に貼り付け</span>
  </header>

  <div id="main">
    <div id="map"></div>
    <div id="panel">
      <div class="search-box">
        <input id="search-input" type="text" placeholder="例: 大阪府堺市、東京駅、35.68,139.77" />
        <button id="search-btn">検索</button>
      </div>

      <div class="coord-card">
        <div class="coord-label">緯度（Lat）</div>
        <div class="coord-value-row">
          <div class="coord-value" id="lat-val">--</div>
          <button class="copy-btn" data-target="lat-val">コピー</button>
        </div>
      </div>

      <div class="coord-card">
        <div class="coord-label">経度（Lng）</div>
        <div class="coord-value-row">
          <div class="coord-value" id="lng-val">--</div>
          <button class="copy-btn" data-target="lng-val">コピー</button>
        </div>
      </div>

      <div class="combo">
        <div class="combo-label">一括コピー（カンマ区切り）</div>
        <div class="combo-value" id="combo-val">--</div>
        <button class="copy-btn" data-target="combo-val" style="width:100%">両方まとめてコピー</button>
      </div>

      <div class="address">
        <div class="address-label">逆ジオコーディング（地名）</div>
        <div id="addr-val">地図をクリックしてください</div>
      </div>

      <div class="hint">
        <strong>使い方:</strong><br>
        1. 地図をクリック、またはドラッグ＆ピンを移動<br>
        2. 検索ボックスに住所・地名・座標を入力して Enter<br>
        3. Yodeck管理画面のウィジェットUI設定で「緯度」「経度」欄に貼り付け<br>
        ※ 検索と逆ジオコーディングは OpenStreetMap（無料・APIキー不要）を使用
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    // 初期位置: 日本中央（大阪～京都あたり）、ズーム6
    var map = L.map('map').setView([35.0, 135.0], 6);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var marker = null;

    function setPin(lat, lng, doReverseGeocode) {
      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng], { draggable: true }).addTo(map);
        marker.on('dragend', function(e) {
          var p = marker.getLatLng();
          setPin(p.lat, p.lng, true);
        });
      }
      updateCoordDisplay(lat, lng);
      if (doReverseGeocode) reverseGeocode(lat, lng);
    }

    function updateCoordDisplay(lat, lng) {
      document.getElementById('lat-val').textContent = lat.toFixed(6);
      document.getElementById('lng-val').textContent = lng.toFixed(6);
      document.getElementById('combo-val').textContent = lat.toFixed(6) + ', ' + lng.toFixed(6);
    }

    // 地図クリックでピン
    map.on('click', function(e) {
      setPin(e.latlng.lat, e.latlng.lng, true);
    });

    // 逆ジオコーディング（座標 → 住所）
    function reverseGeocode(lat, lng) {
      document.getElementById('addr-val').textContent = '取得中...';
      var url = 'https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ja&lat=' + lat + '&lon=' + lng;
      fetch(url)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(j) {
          document.getElementById('addr-val').textContent = (j && j.display_name) || '(取得失敗)';
        })
        .catch(function() {
          document.getElementById('addr-val').textContent = '(取得失敗)';
        });
    }

    // 検索（住所/地名 → 座標、または座標文字列をパース）
    function doSearch() {
      var q = document.getElementById('search-input').value.trim();
      if (!q) return;

      // "35.68,139.77" や "35.68 139.77" 形式をパース
      var coordMatch = q.match(/^\s*(-?\d+\.?\d*)\s*[,\s]\s*(-?\d+\.?\d*)\s*$/);
      if (coordMatch) {
        var lat = parseFloat(coordMatch[1]);
        var lng = parseFloat(coordMatch[2]);
        if (isFinite(lat) && isFinite(lng)) {
          map.setView([lat, lng], 15);
          setPin(lat, lng, true);
          return;
        }
      }

      // Nominatim で住所検索
      var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q=' + encodeURIComponent(q);
      fetch(url)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(j) {
          if (j && j.length > 0) {
            var lat = parseFloat(j[0].lat);
            var lng = parseFloat(j[0].lon);
            map.setView([lat, lng], 15);
            setPin(lat, lng, false);
            document.getElementById('addr-val').textContent = j[0].display_name;
          } else {
            document.getElementById('addr-val').textContent = '(検索ヒットなし: ' + q + ')';
          }
        })
        .catch(function() {
          document.getElementById('addr-val').textContent = '(検索失敗)';
        });
    }

    document.getElementById('search-btn').addEventListener('click', doSearch);
    document.getElementById('search-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doSearch();
    });

    // コピーボタン
    document.querySelectorAll('.copy-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var targetId = btn.getAttribute('data-target');
        var text = document.getElementById(targetId).textContent;
        if (!text || text === '--') return;
        navigator.clipboard.writeText(text).then(function() {
          var orig = btn.textContent;
          btn.textContent = '✓ コピー済';
          btn.classList.add('copied');
          setTimeout(function() {
            btn.textContent = orig;
            btn.classList.remove('copied');
          }, 1500);
        });
      });
    });
  </script>
</body>
</html>
