<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フードロスカウントダウン</title>
  <style>
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.ttf");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
      font-family: keifont, sans-serif;
    }
    body { display: flex; flex-direction: column; }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.3em 0.7em;
      border-bottom: 3px solid #ff6d00;
      background: rgba(0,0,0,0.3);
      height: 9vh;
      flex-shrink: 0;
    }
    #title  { font-size: 4vh; font-weight: bold; color: #fff; letter-spacing: 0.05em; }
    #clock  { font-size: 3vh; color: #aaa; }

    #grid {
      flex: 1;
      display: grid;
      gap: 0.4em;
      padding: 0.5em;
      overflow: hidden;
      align-content: start;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4em 0.7em;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border-left: 6px solid #555;
      gap: 0.5em;
      min-height: 0;
    }
    .card.green  { border-left-color: #00c853; }
    .card.yellow { border-left-color: #ffd600; }
    .card.orange { border-left-color: #ff6d00; }
    .card.red    { border-left-color: #d50000; background: rgba(213,0,0,0.08); }
    .card.expired{ border-left-color: #444; opacity: 0.4; }

    .card-info { flex: 1; min-width: 0; }
    .card-name {
      font-size: 3.5vh;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card.expired .card-name { text-decoration: line-through; color: #888; }
    .card-note { font-size: 2vh; color: #aaa; margin-top: 0.1em; }

    .card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2em;
      flex-shrink: 0;
    }
    .card-countdown {
      font-size: 4vh;
      font-weight: bold;
      letter-spacing: 0.02em;
    }
    .card.green  .card-countdown { color: #00c853; }
    .card.yellow .card-countdown { color: #ffd600; }
    .card.orange .card-countdown { color: #ff9800; }
    .card.red    .card-countdown { color: #ff4444; }
    .card.expired .card-countdown { color: #666; }

    .card-discount {
      font-size: 2.5vh;
      font-weight: bold;
      color: #fff;
      background: #e53935;
      padding: 0.1em 0.5em;
      border-radius: 4px;
    }
    .card.expired .card-discount { background: #444; color: #888; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .card.red .card-countdown { animation: pulse 1s ease-in-out infinite; }

    #empty {
      color: #555;
      text-align: center;
      padding: 3em;
      font-size: 2vh;
    }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="header">
    <div id="title">フードロスカウントダウン</div>
    <div id="clock"></div>
  </div>
  <div id="grid"></div>
</body>
</html>
