<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Calendar</title>
  <style>
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.ttf");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #month { line-height: 1.2; letter-spacing: 0.05em; }
    #date { line-height: 1; letter-spacing: 0.02em; }
    #dayname { line-height: 1.2; letter-spacing: 0.1em; }
    #rokuyo { line-height: 1.2; margin-top: 0.1em; }
    #remaining { line-height: 1.2; margin-top: 0.2em; opacity: 0.85; }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="month"></div>
  <div id="date"></div>
  <div id="dayname"></div>
  <div id="rokuyo"></div>
  <div id="remaining"></div>
</body>
</html>
