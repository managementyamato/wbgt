<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <style>
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.ttf");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #label { line-height: 1.3; letter-spacing: 0.05em; text-align: center; }
    #count { line-height: 1; letter-spacing: 0.02em; text-align: center; }
    #unit { line-height: 1.3; letter-spacing: 0.05em; text-align: center; }
    #sub { line-height: 1.3; opacity: 0.6; text-align: center; margin-top: 0.1em; }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="label"></div>
  <div id="count"></div>
  <div id="unit"></div>
  <div id="sub"></div>
</body>
</html>
