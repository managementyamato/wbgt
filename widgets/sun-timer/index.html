<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sun Timer</title>
  <style>
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.woff2") format("woff2");
    }
    :root {
      --bg: #0d1628;
      --fg: #f5f5f5;
      --accent: #ff9a3c;
      --sub: #9bb0c9;
      --bar-bg: rgba(255,255,255,0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "keifont", "Noto Sans JP", sans-serif;
    }
    #stage {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      grid-template-rows: auto 1fr auto;
      padding: 4vh 5vw;
      gap: 2vh 3vw;
    }

    /* 左列: 日の出・日の入り時刻 */
    .times {
      grid-column: 1;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3vh;
    }
    .time-row {
      display: flex;
      align-items: center;
      gap: 2vw;
    }
    .time-icon {
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 1;
    }
    .time-block { line-height: 1.1; }
    .time-label {
      font-size: clamp(1rem, 1.8vw, 1.8rem);
      color: var(--sub);
      margin-bottom: 0.3em;
    }
    .time-value {
      font-size: clamp(2.5rem, 5.5vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* 右列: カウントダウン */
    .countdown {
      grid-column: 2;
      grid-row: 1 / 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-left: 1px solid rgba(255,255,255,0.12);
      padding-left: 3vw;
    }
    .cd-label {
      font-size: clamp(1.1rem, 2.2vw, 2.2rem);
      color: var(--sub);
      margin-bottom: 1.5vh;
    }
    .cd-value {
      font-size: clamp(4rem, 11vw, 11rem);
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .cd-unit {
      font-size: 0.5em;
      color: var(--fg);
      margin-left: 0.1em;
    }
    .cd-sub {
      font-size: clamp(0.9rem, 1.6vw, 1.6rem);
      color: var(--sub);
      margin-top: 1.5vh;
    }

    /* 下段: 進行バー・現在地 */
    .footer {
      grid-column: 1 / 3;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      gap: 1.2vh;
    }
    .progress-wrap {
      position: relative;
      width: 100%;
      height: 0.8vh;
      background: var(--bar-bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      background: linear-gradient(90deg, #ff9a3c 0%, #ffd84d 60%, #ff6b6b 100%);
      border-radius: 999px;
      transition: width 0.6s ease;
    }
    .loc {
      font-size: clamp(0.8rem, 1.4vw, 1.4rem);
      color: var(--sub);
      text-align: right;
    }
    .loc-source {
      opacity: 0.6;
      margin-left: 0.5em;
      font-size: 0.8em;
    }

    .loading {
      grid-column: 1 / 3;
      grid-row: 1 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 2.5vw, 2.5rem);
      color: var(--sub);
    }
  </style>
  <script src="shared/location.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div id="stage">
    <div class="loading" id="loading">現在地を取得中...</div>
    <div class="times" id="times" style="display:none">
      <div class="time-row">
        <div class="time-icon">🌅</div>
        <div class="time-block">
          <div class="time-label">日の出</div>
          <div class="time-value" id="sunrise">--:--</div>
        </div>
      </div>
      <div class="time-row">
        <div class="time-icon">🌇</div>
        <div class="time-block">
          <div class="time-label">日の入</div>
          <div class="time-value" id="sunset">--:--</div>
        </div>
      </div>
    </div>
    <div class="countdown" id="countdown" style="display:none">
      <div class="cd-label" id="cd-label">日没まで</div>
      <div class="cd-value"><span id="cd-h">--</span><span class="cd-unit">時間</span><span id="cd-m">--</span><span class="cd-unit">分</span></div>
      <div class="cd-sub" id="cd-sub">現在 --:--</div>
    </div>
    <div class="footer" id="footer" style="display:none">
      <div class="progress-wrap"><div class="progress-fill" id="progress"></div></div>
      <div class="loc">現在地: <span id="loc-name">--</span><span class="loc-source" id="loc-source"></span></div>
    </div>
  </div>
</body>
</html>
