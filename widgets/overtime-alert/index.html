<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"/><title>残業・超勤アラートボード</title>
<style>
@font-face{font-family:"keifont";src:url("fonts/keifont.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:keifont,sans-serif;background:#0d0d17;color:#fff}
body{display:flex;flex-direction:column}
#header{display:flex;align-items:center;justify-content:space-between;padding:.4em .8em;flex-shrink:0;background:linear-gradient(90deg,#1a1a2e,#2d2d4a);border-bottom:2px solid #7b1fa2}
#dept-name{font-size:3vh;font-weight:bold;color:#ce93d8;letter-spacing:.1em}
#clock{font-size:2.5vh;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
#summary{display:flex;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.sum-box{flex:1;text-align:center;padding:.5em .3em;border-right:1px solid rgba(255,255,255,.08)}
.sum-box:last-child{border-right:none}
.sum-label{font-size:1.4vh;color:rgba(255,255,255,.4)}
.sum-val{font-size:3.5vh;font-weight:bold;font-variant-numeric:tabular-nums}
.over{color:#ef5350;animation:blink .8s step-end infinite}
.warn{color:#ffca28}
.ok{color:#66bb6a}
.col-blue{color:#42a5f5}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#list-header{display:grid;grid-template-columns:3fr 2fr 2fr 5fr 2fr 2fr;gap:.3em;padding:.25em .5em;font-size:1.5vh;color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
#person-list{flex:1;overflow:hidden;display:flex;flex-direction:column}
.person-row{display:grid;grid-template-columns:3fr 2fr 2fr 5fr 2fr 2fr;gap:.3em;padding:.4em .5em;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
.row-over{background:rgba(239,83,80,.07)}
.row-warn{background:rgba(255,202,40,.04)}
.p-name{font-size:2vh;font-weight:bold;color:#fff}
.p-hours{font-size:2.8vh;font-weight:bold;text-align:right;font-variant-numeric:tabular-nums}
.p-h{font-size:1.5vh;color:rgba(255,255,255,.4)}
.p-diff{font-size:1.8vh;font-weight:bold;text-align:center;font-variant-numeric:tabular-nums}
.diff-up{color:#ef5350}
.diff-dn{color:#66bb6a}
.p-bar-wrap{height:1.6vh;background:rgba(255,255,255,.1);border-radius:1em;overflow:visible;position:relative}
.p-bar{height:100%;border-radius:1em;transition:width .5s ease;position:relative}
.bar-ok{background:#66bb6a}
.bar-warn{background:#ffca28}
.bar-over{background:#ef5350}
.p-limit-line{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.6)}
.p-limit{font-size:1.5vh;color:rgba(255,255,255,.35);text-align:center}
.p-note{font-size:1.4vh;color:rgba(255,255,255,.35);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script src="app.js"></script>
</head>
<body>
<div id="header">
  <span id="dept-name">残業アラートボード</span>
  <span id="clock">--:--</span>
</div>
<div id="summary">
  <div class="sum-box"><div class="sum-label">上限超過</div><div class="sum-val ok" id="over-count">-</div></div>
  <div class="sum-box"><div class="sum-label">警戒（90%以上）</div><div class="sum-val warn" id="warn-count">-</div></div>
  <div class="sum-box"><div class="sum-label">総残業時間</div><div class="sum-val col-blue" id="total-hours">-</div></div>
</div>
<div id="list-header">
  <span>氏名</span><span style="text-align:right">今月</span><span style="text-align:center">先月比</span><span>進捗</span><span style="text-align:center">上限</span><span>備考</span>
</div>
<div id="person-list"></div>
</body></html>
