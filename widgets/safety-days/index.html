<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>無災害記録カウンター</title>
  <style>
    @font-face { font-family: "keifont"; src: url("fonts/keifont.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: keifont, sans-serif;
      transition: background 0.8s ease;
    }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* テーマ */
    body.theme-normal { background: linear-gradient(160deg, #1a237e 0%, #0d47a1 100%); }
    body.theme-good   { background: linear-gradient(160deg, #1b5e20 0%, #2e7d32 100%); }
    body.theme-great  { background: linear-gradient(160deg, #e65100 0%, #bf360c 100%); }
    body.theme-gold   { background: linear-gradient(160deg, #f57f17 0%, #ff6f00 100%); }

    /* サイト名 */
    #site-title {
      font-size: 3.5vh; color: rgba(255,255,255,0.85);
      letter-spacing: 0.12em; margin-bottom: 0.5em;
    }

    /* シールドアイコン */
    #shield {
      font-size: 6vh; margin-bottom: 0.3em; line-height: 1;
    }

    /* ラベル */
    #label {
      font-size: 2.8vh; color: rgba(255,255,255,0.75);
      letter-spacing: 0.2em; margin-bottom: 0.1em;
    }

    /* メイン数値 */
    #counter-wrap {
      display: flex; align-items: baseline; gap: 0.15em;
      margin-bottom: 0.2em;
    }
    #days-number {
      font-size: 32vh; font-weight: bold; color: #fff; line-height: 0.85;
      text-shadow: 0 6px 30px rgba(0,0,0,0.4);
      letter-spacing: -0.03em;
    }
    #days-unit {
      font-size: 8vh; font-weight: bold; color: rgba(255,255,255,0.8);
      align-self: flex-end; margin-bottom: 0.3em;
    }

    /* 記念日マーカー */
    #milestone {
      font-size: 4vh; color: #fff200;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      letter-spacing: 0.1em; margin-bottom: 0.2em;
      animation: pop 0.6s ease;
    }
    @keyframes pop {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* メッセージ */
    #message {
      font-size: 2.4vh; color: rgba(255,255,255,0.9);
      text-align: center; padding: 0 1em; letter-spacing: 0.05em;
      margin-bottom: 0.4em;
    }

    /* 詳細（開始日） */
    #detail {
      font-size: 1.8vh; color: rgba(255,255,255,0.5);
      letter-spacing: 0.08em; margin-bottom: 0.4em;
    }

    /* ノート（スローガン） */
    #note-text {
      font-size: 2.2vh; color: rgba(255,255,255,0.7);
      letter-spacing: 0.1em;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 0.6em; margin-top: 0.2em;
      text-align: center;
    }

    /* 金テーマ時の星キラキラ */
    body.theme-gold #days-number { color: #fff200; text-shadow: 0 0 40px rgba(255,242,0,0.6), 0 6px 30px rgba(0,0,0,0.4); }
  </style>
  <script src="app.js"></script>
</head>
<body class="theme-normal">
  <div id="site-title">現場名</div>
  <div id="shield">🛡️</div>
  <div id="label">無 災 害 記 録</div>
  <div id="counter-wrap">
    <div id="days-number">--</div>
    <div id="days-unit">日</div>
  </div>
  <div id="milestone" style="display:none"></div>
  <div id="message">開始日を設定してください</div>
  <div id="detail"></div>
  <div id="note-text"></div>
</body>
</html>
