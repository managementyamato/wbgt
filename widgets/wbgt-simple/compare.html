<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>WBGT スタイル比較</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; background: #2b2f36; color: #e8e8e8; padding: 16px; }
h1 { font-size: 16px; margin-bottom: 12px; color: #9bb0c9; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 12px; }
.card { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; overflow: hidden; }
.card h2 { background: #0f3460; padding: 6px 10px; font-size: 13px; color: #e0e0e0; }
.card iframe { display: block; width: 100%; height: 260px; border: 0; background: #ffffff; }
</style>
</head>
<body>
<h1>WBGT スタイルバリアント比較</h1>
<div class="grid">
	<div class="card"><h2>既定（青ヘッダー）</h2><iframe src="./"></iframe></div>
	<div class="card"><h2>A: 値の上に小さく WBGT</h2><iframe src="./?style=a"></iframe></div>
	<div class="card"><h2>B: 値の横に小さく WBGT</h2><iframe src="./?style=b"></iframe></div>
	<div class="card"><h2>C: 右下透かし</h2><iframe src="./?style=c"></iframe></div>
	<div class="card"><h2>D: 左上リボン</h2><iframe src="./?style=d"></iframe></div>
	<div class="card"><h2>E: 完全廃止</h2><iframe src="./?style=e"></iframe></div>
</div>
</body>
</html>
