<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>本日売上進捗</title>
  <style>
    @font-face { font-family: "keifont"; src: url("fonts/keifont.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: keifont, sans-serif; transition: background 0.6s; }
    body { display: flex; flex-direction: column; }

    body.theme-normal { background: linear-gradient(160deg, #1a237e, #283593); }
    body.theme-good   { background: linear-gradient(160deg, #0d47a1, #1565c0); }
    body.theme-great  { background: linear-gradient(160deg, #1b5e20, #2e7d32); }

    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.4em 0.8em; flex-shrink: 0;
      background: rgba(0,0,0,0.3);
    }
    #shop-name { font-size: 2.8vh; font-weight: bold; color: #fff; letter-spacing: 0.08em; }
    #clock { font-size: 2vh; color: rgba(255,255,255,0.6); }

    /* メイン指標 */
    #main-metric {
      flex-shrink: 0; padding: 0.8em 1em;
      display: flex; flex-direction: column; align-items: center; gap: 0.2em;
    }
    #main-label   { font-size: 2.5vh; color: rgba(255,255,255,0.7); letter-spacing: 0.1em; }
    #main-current { font-size: 14vh; font-weight: bold; color: #fff; line-height: 0.9;
                    text-shadow: 0 4px 20px rgba(0,0,0,0.3); letter-spacing: -0.02em; }
    #main-target  { font-size: 2.5vh; color: rgba(255,255,255,0.5); }
    #main-pct     { font-size: 5vh; font-weight: bold; color: #fff200; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }

    #main-bar-wrap { width: 80%; height: 1.2vh; background: rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; margin: 0.2em auto 0; }
    #main-bar-fill { height: 100%; border-radius: 6px; transition: width 1s ease, background 0.5s; }

    /* サブ指標 */
    #sub-metrics {
      flex: 1; display: flex; flex-direction: column;
      gap: 0.35em; padding: 0.4em 0.8em; overflow: hidden;
    }
    .sub-item {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 0.3em 0.6em; border-radius: 6px; background: rgba(255,255,255,0.07);
    }
    .sub-label  { font-size: 1.8vh; color: rgba(255,255,255,0.6); margin-bottom: 0.15em; }
    .sub-values { display: flex; align-items: baseline; gap: 0.4em; margin-bottom: 0.15em; }
    .sub-current { font-size: 3.5vh; font-weight: bold; color: #fff; }
    .sub-sep     { font-size: 2vh; color: rgba(255,255,255,0.3); }
    .sub-target  { font-size: 2.2vh; color: rgba(255,255,255,0.5); }
    .sub-pct     { font-size: 2.5vh; font-weight: bold; color: #90caf9; margin-left: auto; }
    .sub-pct.pct-great { color: #a5d6a7; }
    .sub-bar-wrap { height: 0.6vh; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .sub-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
  </style>
  <script src="app.js"></script>
</head>
<body class="theme-normal">
  <div id="header">
    <span id="shop-name">本日の売上進捗</span>
    <span id="clock">--:-- 現在</span>
  </div>
  <div id="main-metric">
    <div id="main-label">売上</div>
    <div id="main-current">--</div>
    <div id="main-target">目標 --</div>
    <div id="main-pct">--%</div>
    <div id="main-bar-wrap"><div id="main-bar-fill" style="width:0%"></div></div>
  </div>
  <div id="sub-metrics"></div>
</body>
</html>
