<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>入退場管理ボード</title>
  <style>
    @font-face { font-family: "keifont"; src: url("fonts/keifont.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: keifont, sans-serif; background: #0d1117; color: #fff; }
    body { display: flex; flex-direction: column; }

    /* ヘッダー */
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5em 0.8em; flex-shrink: 0;
      background: linear-gradient(90deg, #006064, #00838f);
      border-bottom: 2px solid #00bcd4;
    }
    #site-name { font-size: 3vh; font-weight: bold; color: #fff; letter-spacing: 0.08em; }
    #clock { font-size: 3.5vh; font-weight: bold; color: rgba(255,255,255,0.9); font-variant-numeric: tabular-nums; }

    /* 在場カウント */
    #count-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5em; padding: 0.6em 0.8em; flex-shrink: 0;
      background: rgba(0,188,212,0.1);
      border-bottom: 1px solid rgba(0,188,212,0.2);
    }
    #count-label { font-size: 3vh; color: rgba(255,255,255,0.7); }
    #on-site-count { font-size: 9vh; font-weight: bold; color: #00e5ff; line-height: 1; text-shadow: 0 0 20px rgba(0,229,255,0.4); }
    #count-unit { font-size: 3.5vh; color: rgba(255,255,255,0.7); }
    #total-count { font-size: 1.8vh; color: rgba(255,255,255,0.45); margin-left: 0.8em; }

    /* エントリーリスト */
    #entry-list {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
      gap: 0.3em; padding: 0.5em 0.8em;
    }

    .entry-item {
      display: flex; align-items: center; gap: 0.6em;
      padding: 0.45em 0.7em; border-radius: 6px;
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .entry-item.exited { opacity: 0.35; }

    .entry-dot {
      width: 1.2vh; height: 1.2vh; border-radius: 50%; flex-shrink: 0;
    }
    .dot-green { background: #00e676; box-shadow: 0 0 8px rgba(0,230,118,0.8); }
    .dot-gray  { background: #546e7a; }

    .entry-info { flex: 1; display: flex; align-items: baseline; gap: 0.5em; min-width: 0; overflow: hidden; }
    .entry-name { font-size: 2.3vh; font-weight: bold; color: #fff; white-space: nowrap; }
    .entry-company { font-size: 1.8vh; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .entry-time { display: flex; align-items: center; gap: 0.3em; flex-shrink: 0; }
    .time-enter { font-size: 2vh; color: rgba(255,255,255,0.7); font-variant-numeric: tabular-nums; }
    .time-arrow { font-size: 1.6vh; color: rgba(255,255,255,0.3); }
    .time-exit  { font-size: 2vh; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; }
    .time-badge {
      font-size: 1.6vh; padding: 0.1em 0.5em; border-radius: 3px;
      background: rgba(0,230,118,0.2); color: #00e676;
      font-weight: bold;
    }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="header">
    <div id="site-name">入退場管理</div>
    <div id="clock">--:--</div>
  </div>
  <div id="count-bar">
    <span id="count-label">現在入場者数</span>
    <span id="on-site-count">--</span>
    <span id="count-unit">名</span>
    <span id="total-count"></span>
  </div>
  <div id="entry-list"></div>
</body>
</html>
