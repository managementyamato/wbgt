<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Year Progress</title>
  <style>
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.ttf");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 3%;
    }
    .progress-row {
      width: 90%;
      margin: 0.4em 0;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .progress-bar-bg {
      width: 100%;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.15em;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 1s ease;
    }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="row-year" class="progress-row">
    <div class="progress-label">
      <span id="label-year"></span>
      <span id="pct-year"></span>
    </div>
    <div id="bar-bg-year" class="progress-bar-bg">
      <div id="bar-year" class="progress-bar-fill"></div>
    </div>
  </div>
  <div id="row-month" class="progress-row">
    <div class="progress-label">
      <span id="label-month"></span>
      <span id="pct-month"></span>
    </div>
    <div id="bar-bg-month" class="progress-bar-bg">
      <div id="bar-month" class="progress-bar-fill"></div>
    </div>
  </div>
  <div id="row-day" class="progress-row">
    <div class="progress-label">
      <span id="label-day"></span>
      <span id="pct-day"></span>
    </div>
    <div id="bar-bg-day" class="progress-bar-bg">
      <div id="bar-day" class="progress-bar-fill"></div>
    </div>
  </div>
</body>
</html>
