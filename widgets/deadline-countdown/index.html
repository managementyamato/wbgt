<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"/><title>納期カウントダウン</title>
<style>
@font-face{font-family:"keifont";src:url("fonts/keifont.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:keifont,sans-serif;background:#0d0d0d;color:#fff}
body{display:flex;flex-direction:column}
#header{display:flex;align-items:center;justify-content:space-between;padding:.4em .8em;flex-shrink:0;background:linear-gradient(90deg,#1a1200,#332200);border-bottom:2px solid #f57f17}
#board-title{font-size:3vh;font-weight:bold;color:#ffcc80;letter-spacing:.1em}
#clock{font-size:2.5vh;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
#summary{display:flex;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.sum-box{flex:1;text-align:center;padding:.5em .3em;border-right:1px solid rgba(255,255,255,.08)}
.sum-box:last-child{border-right:none}
.sum-label{font-size:1.4vh;color:rgba(255,255,255,.4)}
.sum-val{font-size:3.5vh;font-weight:bold}
.over{color:#ef5350;animation:blink .8s step-end infinite}
.warn{color:#ffca28}
.ok{color:#66bb6a}
.col-blue{color:#42a5f5}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#list-header{display:grid;grid-template-columns:5fr 3fr 2fr 2.5fr 3fr;gap:.3em;padding:.25em .5em;font-size:1.5vh;color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
#project-list{flex:1;overflow:hidden;display:flex;flex-direction:column}
.proj-row{display:grid;grid-template-columns:5fr 3fr 2fr 2.5fr 3fr;gap:.3em;padding:.4em .5em;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
.row-overdue{background:rgba(239,83,80,.08)}
.row-urgent{background:rgba(255,152,0,.06)}
.p-name{font-size:2vh;font-weight:bold;color:#fff}
.p-date{font-size:1.8vh;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.p-person{font-size:1.8vh;color:rgba(255,255,255,.6)}
.p-days{font-size:2.8vh;font-weight:bold;text-align:center;font-variant-numeric:tabular-nums}
.p-days.overdue{color:#ef5350;animation:blink .8s step-end infinite}
.p-days.urgent{color:#ff7043}
.p-days.warn{color:#ffca28}
.p-days.ok{color:#66bb6a}
.p-days.done{color:rgba(255,255,255,.3);font-size:1.8vh}
.p-days.hold{color:rgba(255,255,255,.3);font-size:1.8vh}
.p-note{font-size:1.5vh;color:rgba(255,255,255,.35);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script src="app.js"></script>
</head>
<body>
<div id="header">
  <span id="board-title">納期カウントダウン</span>
  <span id="clock">--:--</span>
</div>
<div id="summary">
  <div class="sum-box"><div class="sum-label">総件数</div><div class="sum-val col-blue" id="total-count">-</div></div>
  <div class="sum-box"><div class="sum-label">7日以内</div><div class="sum-val ok" id="urgent-count">-</div></div>
  <div class="sum-box"><div class="sum-label">納期超過</div><div class="sum-val ok" id="overdue-count">-</div></div>
</div>
<div id="list-header">
  <span>案件名</span><span>納期</span><span>担当</span><span style="text-align:center">残り</span><span>備考</span>
</div>
<div id="project-list"></div>
</body></html>
