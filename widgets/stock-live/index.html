<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在庫・売切れライブ</title>
  <style>
    @font-face { font-family: "keifont"; src: url("fonts/keifont.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: keifont, sans-serif; }
    body { display: flex; flex-direction: column; }

    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.3em 0.8em; height: 9vh; flex-shrink: 0;
      background: rgba(0,0,0,0.3); border-bottom: 3px solid #c62828;
    }
    #title { font-size: 3.8vh; font-weight: bold; color: #fff; }
    #clock { font-size: 2.8vh; color: #aaa; }

    #grid {
      flex: 1; display: grid; gap: 0.4em; padding: 0.5em;
      overflow: hidden; align-content: start;
    }

    .card {
      display: flex; align-items: center;
      padding: 0.45em 0.8em; border-radius: 8px;
      background: rgba(255,255,255,0.05); gap: 0.8em;
      border-left: 6px solid #555;
    }
    .card.in-stock  { border-left-color: #43a047; }
    .card.low-stock { border-left-color: #ffa000; background: rgba(255,160,0,0.07); }
    .card.sold-out  { border-left-color: #c62828; background: rgba(198,40,40,0.08); }

    .status-icon { font-size: 3.5vh; flex-shrink: 0; }

    .card-name { flex: 1; font-size: 3.2vh; font-weight: bold; }
    .in-stock  .card-name { color: #fff; }
    .low-stock .card-name { color: #fff; }
    .sold-out  .card-name { color: #aaa; text-decoration: line-through; }

    .card-note { font-size: 2vh; color: #888; }

    .card-right { flex-shrink: 0; text-align: right; }
    .stock-count { font-size: 4.5vh; font-weight: bold; line-height: 1; }
    .in-stock  .stock-count { color: #66bb6a; }
    .low-stock .stock-count { color: #ffca28; }
    .sold-out  .stock-count { color: #ef5350; }
    .stock-unit { font-size: 2vh; color: #888; }

    .sold-badge {
      display: inline-block; background: #c62828; color: #fff;
      font-size: 2vh; font-weight: bold; padding: 0.1em 0.5em; border-radius: 4px;
    }
    .low-badge {
      display: inline-block; background: #e65100; color: #fff;
      font-size: 2vh; font-weight: bold; padding: 0.1em 0.5em; border-radius: 4px;
    }

    #footer {
      height: 5vh; flex-shrink: 0; display: flex; align-items: center;
      padding: 0 0.8em; background: rgba(0,0,0,0.2); border-top: 1px solid #222; gap: 1.5em;
    }
    .leg { font-size: 2vh; color: #aaa; display: flex; align-items: center; gap: 0.3em; }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="header">
    <div id="title">在庫・売切れライブ</div>
    <div id="clock"></div>
  </div>
  <div id="grid"></div>
  <div id="footer">
    <div class="leg">🟢 在庫あり</div>
    <div class="leg">🟡 残りわずか</div>
    <div class="leg">🔴 売り切れ</div>
  </div>
</body>
</html>
