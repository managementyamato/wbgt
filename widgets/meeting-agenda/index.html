<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>朝礼・ミーティング次第</title>
  <style>
    @font-face { font-family: "keifont"; src: url("fonts/keifont.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: keifont, sans-serif; background: #111827; color: #fff; }
    body { display: flex; flex-direction: column; }

    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45em 0.8em; flex-shrink: 0;
      background: linear-gradient(90deg, #1f2937, #374151);
      border-bottom: 2px solid #6b7280;
    }
    #meeting-title { font-size: 3.2vh; font-weight: bold; color: #fff; letter-spacing: 0.1em; }
    #header-right  { display: flex; align-items: center; gap: 0.8em; }
    #today-date    { font-size: 2.2vh; color: rgba(255,255,255,0.65); }
    #total-mins    { font-size: 1.8vh; color: rgba(255,255,255,0.4); }

    #agenda-list {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
      gap: 0.3em; padding: 0.5em 0.7em;
    }

    .agenda-item {
      flex: 1; display: flex; align-items: center; gap: 0.6em;
      padding: 0.4em 0.7em; border-radius: 6px;
      background: rgba(255,255,255,0.04);
      border-left: 4px solid rgba(255,255,255,0.1);
      transition: all 0.4s ease;
    }
    .agenda-item.current {
      background: rgba(99,102,241,0.2);
      border-left-color: #818cf8;
      transform: scale(1.01);
      box-shadow: 0 2px 12px rgba(99,102,241,0.3);
    }

    .ag-num {
      font-size: 3.5vh; font-weight: bold;
      color: rgba(255,255,255,0.2); min-width: 1.5em; text-align: center;
    }
    .current .ag-num { color: #818cf8; }

    .ag-item {
      flex: 1; font-size: 3vh; color: rgba(255,255,255,0.7); letter-spacing: 0.04em;
    }
    .current .ag-item { color: #fff; font-weight: bold; }

    .ag-note { font-size: 1.8vh; color: rgba(255,255,255,0.35); margin-left: 0.8em; }
    .current .ag-note { color: rgba(255,255,255,0.55); }

    .ag-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 0.2em; flex-shrink: 0; }
    .ag-person { font-size: 1.9vh; color: rgba(255,255,255,0.5); }
    .ag-mins   { font-size: 2vh; font-weight: bold; color: rgba(255,255,255,0.4); }
    .current .ag-mins { color: #a5b4fc; }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="header">
    <span id="meeting-title">朝礼次第</span>
    <div id="header-right">
      <span id="today-date"></span>
      <span id="total-mins"></span>
    </div>
  </div>
  <div id="agenda-list"></div>
</body>
</html>
