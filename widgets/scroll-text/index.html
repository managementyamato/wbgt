<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Scroll Text</title>
  <style>
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.woff2") format("woff2");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    #stage {
      position: fixed;
      top: 5%; left: 0;
      width: 100%; height: 90%;
      overflow: hidden;
    }
    #strip {
      position: absolute;
      top: 50%;
      left: 0;
      white-space: nowrap;
      will-change: transform;
      transform: translate3d(0, -50%, 0);
    }
    #strip span {
      display: inline-block;
      white-space: nowrap;
      line-height: 1;
    }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="stage">
    <div id="strip"></div>
  </div>
</body>
</html>
