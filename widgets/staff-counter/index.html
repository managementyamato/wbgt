<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>担当者実績カウンター</title>
  <style>
    @font-face { font-family: "keifont"; src: url("fonts/keifont.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: keifont, sans-serif; }
    body { display: flex; flex-direction: column; }

    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.3em 0.8em; height: 9vh; flex-shrink: 0;
      background: rgba(0,0,0,0.3); border-bottom: 3px solid #f57f17;
    }
    #title { font-size: 3.8vh; font-weight: bold; color: #fff; }
    #header-right { font-size: 2.2vh; color: #aaa; text-align: right; line-height: 1.5; }

    #grid {
      flex: 1; display: grid; gap: 0.5em; padding: 0.5em;
      overflow: hidden; align-content: start;
    }

    .card {
      display: flex; align-items: center;
      padding: 0.5em 0.8em; border-radius: 8px;
      background: rgba(255,255,255,0.05); gap: 0.8em;
      border-left: 6px solid #f57f17;
    }
    .card.rank1 { border-left-color: #ffd700; background: rgba(255,215,0,0.07); }
    .card.rank2 { border-left-color: #c0c0c0; }
    .card.rank3 { border-left-color: #cd7f32; }

    .rank-badge {
      font-size: 3.5vh; font-weight: bold; flex-shrink: 0; width: 1.8em; text-align: center;
    }
    .rank1 .rank-badge { color: #ffd700; }
    .rank2 .rank-badge { color: #c0c0c0; }
    .rank3 .rank-badge { color: #cd7f32; }
    .card:not(.rank1):not(.rank2):not(.rank3) .rank-badge { color: #555; }

    .card-name { flex: 1; font-size: 3.2vh; font-weight: bold; color: #fff; }
    .card-role { font-size: 2vh; color: #888; }

    .card-right { flex-shrink: 0; text-align: right; }
    .count-num  { font-size: 5.5vh; font-weight: bold; color: #ff9800; line-height: 1; }
    .count-unit { font-size: 2.2vh; color: #aaa; }

    .bar-wrap { margin-top: 0.2em; height: 0.6vh; background: #222; border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; background: linear-gradient(90deg, #f57f17, #ffca28); border-radius: 3px; transition: width 0.5s ease; }

    #footer {
      height: 5vh; flex-shrink: 0; display: flex; align-items: center;
      padding: 0 0.8em; background: rgba(0,0,0,0.2); border-top: 1px solid #222;
      gap: 1.5em;
    }
    .total-stat { font-size: 2vh; color: #aaa; }
    .total-stat span { font-weight: bold; color: #ff9800; }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="header">
    <div id="title">担当者実績カウンター</div>
    <div id="header-right"></div>
  </div>
  <div id="grid"></div>
  <div id="footer"></div>
</body>
</html>
