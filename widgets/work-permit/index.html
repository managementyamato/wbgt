<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>作業許可証掲示板</title>
  <style>
    @font-face { font-family: "keifont"; src: url("fonts/keifont.ttf"); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: keifont, sans-serif; background: #1a1200; color: #fff; }
    body { display: flex; flex-direction: column; }

    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45em 0.8em; flex-shrink: 0;
      background: linear-gradient(90deg, #e65100, #bf360c);
      border-bottom: 2px solid #ff8a65;
    }
    #header-left { display: flex; align-items: center; gap: 0.8em; }
    #board-title  { font-size: 3.2vh; font-weight: bold; color: #fff; letter-spacing: 0.1em; }
    #active-wrap  { display: flex; align-items: baseline; gap: 0.3em; background: rgba(0,0,0,0.3); padding: 0.1em 0.6em; border-radius: 4px; }
    #active-count { font-size: 3.5vh; font-weight: bold; color: #ffcc02; }
    #active-label { font-size: 1.8vh; color: rgba(255,255,255,0.7); }
    #clock        { font-size: 3vh; font-weight: bold; color: rgba(255,255,255,0.8); font-variant-numeric: tabular-nums; }

    #permit-list {
      flex: 1; overflow: hidden; display: flex; flex-direction: column;
      gap: 0.4em; padding: 0.5em 0.7em;
    }

    .permit-item {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 0.4em 0.7em; border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border-left: 5px solid rgba(255,255,255,0.2);
    }
    .permit-item.status-active  { border-left-color: #ff8a65; background: rgba(230,81,0,0.12); }
    .permit-item.status-pending { border-left-color: #ffca28; background: rgba(255,202,40,0.07); }
    .permit-item.status-done    { border-left-color: #66bb6a; background: rgba(102,187,106,0.06); opacity: 0.6; }

    .permit-header { display: flex; align-items: center; gap: 0.5em; margin-bottom: 0.2em; }
    .permit-icon  { font-size: 2vh; }
    .permit-id    { font-size: 1.8vh; color: rgba(255,255,255,0.45); min-width: 5em; }
    .permit-badge { font-size: 1.6vh; padding: 0.1em 0.5em; border-radius: 3px; font-weight: bold; }
    .badge-active  { background: rgba(230,81,0,0.4);    color: #ffccbc; }
    .badge-pending { background: rgba(255,202,40,0.3);  color: #fff9c4; }
    .badge-done    { background: rgba(102,187,106,0.3); color: #c8e6c9; }
    .permit-time  { font-size: 2vh; color: rgba(255,255,255,0.6); margin-left: auto; font-variant-numeric: tabular-nums; }

    .permit-work { font-size: 2.8vh; font-weight: bold; color: #fff; letter-spacing: 0.03em; margin-bottom: 0.2em; }
    .permit-sub  { display: flex; gap: 1.5em; }
    .permit-person, .permit-place { font-size: 1.9vh; color: rgba(255,255,255,0.6); }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="header">
    <div id="header-left">
      <span id="board-title">作業許可証</span>
      <div id="active-wrap">
        <span id="active-count">--</span>
        <span id="active-label">件 作業中</span>
      </div>
    </div>
    <span id="clock">--:--</span>
  </div>
  <div id="permit-list"></div>
</body>
</html>
