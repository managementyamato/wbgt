<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    @font-face {
      font-family: "keifont";
      src: url("fonts/keifont.ttf");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #phase-label { line-height: 1.3; letter-spacing: 0.08em; text-align: center; }
    #timer-display { line-height: 1; text-align: center; }
    #cycle-info { line-height: 1.3; text-align: center; margin-top: 0.2em; opacity: 0.5; }
    canvas { display: block; }
  </style>
  <script src="app.js"></script>
</head>
<body>
  <div id="phase-label"></div>
  <canvas id="ring"></canvas>
  <div id="timer-display"></div>
  <div id="cycle-info"></div>
</body>
</html>
