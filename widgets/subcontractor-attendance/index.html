<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"/><title>協力業者勤怠サマリー</title>
<style>
@font-face{font-family:"keifont";src:url("fonts/keifont.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:keifont,sans-serif;background:#0d1117;color:#fff}
body{display:flex;flex-direction:column}
#header{display:flex;align-items:center;justify-content:space-between;padding:.4em .8em;flex-shrink:0;background:linear-gradient(90deg,#1a237e,#283593);border-bottom:2px solid #5c6bc0}
#site-name{font-size:3vh;font-weight:bold;color:#fff;letter-spacing:.1em}
#clock{font-size:2.5vh;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
#summary{display:flex;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.summary-box{flex:1;text-align:center;padding:.5em .3em;border-right:1px solid rgba(255,255,255,.08)}
.summary-box:last-child{border-right:none}
.summary-label{font-size:1.4vh;color:rgba(255,255,255,.4)}
.summary-val{font-size:3.8vh;font-weight:bold}
.rate-ok{color:#66bb6a}
.rate-warn{color:#ffca28}
.rate-bad{color:#ef5350}
.col-blue{color:#42a5f5}
.col-red{color:#ef5350}
#list-header{display:grid;grid-template-columns:5fr 3fr 4fr 2fr;gap:.3em;padding:.25em .5em;font-size:1.5vh;color:rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
#company-list{flex:1;overflow:hidden;display:flex;flex-direction:column}
.company-row{display:grid;grid-template-columns:5fr 3fr 4fr 2fr;gap:.3em;padding:.4em .5em;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
.c-name{font-size:1.9vh;color:#fff;font-weight:bold}
.c-note{font-size:1.4vh;color:rgba(255,255,255,.4);font-weight:normal;display:block}
.c-nums{display:flex;align-items:baseline;gap:.3em;font-variant-numeric:tabular-nums}
.c-present{font-size:2.8vh;font-weight:bold;color:#42a5f5}
.c-sep{font-size:1.8vh;color:rgba(255,255,255,.3)}
.c-planned{font-size:1.8vh;color:rgba(255,255,255,.4)}
.c-absent{font-size:1.5vh;background:#b71c1c;color:#ef9a9a;padding:.1em .3em;border-radius:.2em;margin-left:.3em}
.c-late{font-size:1.5vh;background:#e65100;color:#ffcc80;padding:.1em .3em;border-radius:.2em;margin-left:.2em}
.c-bar-wrap{height:1.4vh;background:rgba(255,255,255,.1);border-radius:1em;overflow:hidden}
.c-bar{height:100%;border-radius:1em;transition:width .5s ease}
.c-bar.rate-ok{background:#66bb6a}
.c-bar.rate-warn{background:#ffca28}
.c-bar.rate-bad{background:#ef5350}
.c-rate{font-size:2.2vh;font-weight:bold;text-align:right;font-variant-numeric:tabular-nums}
</style>
<script src="app.js"></script>
</head>
<body>
<div id="header">
  <span id="site-name">協力業者勤怠サマリー</span>
  <span id="clock">--:--</span>
</div>
<div id="summary">
  <div class="summary-box"><div class="summary-label">予定人数</div><div class="summary-val col-blue" id="total-planned">-</div></div>
  <div class="summary-box"><div class="summary-label">出勤人数</div><div class="summary-val rate-ok" id="total-present">-</div></div>
  <div class="summary-box"><div class="summary-label">欠勤人数</div><div class="summary-val col-red" id="total-absent">-</div></div>
  <div class="summary-box"><div class="summary-label">全体出勤率</div><div class="summary-val" id="total-rate">-</div></div>
</div>
<div id="list-header">
  <span>業者名</span><span>出勤/予定</span><span>達成率</span><span style="text-align:right">%</span>
</div>
<div id="company-list"></div>
</body></html>
