<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"/><title>省エネ・電力モニター</title>
<style>
@font-face{font-family:"keifont";src:url("fonts/keifont.ttf")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:keifont,sans-serif;background:#0a1a0a;color:#fff}
body{display:flex;flex-direction:column}
#header{display:flex;align-items:center;justify-content:space-between;padding:.4em .8em;flex-shrink:0;background:linear-gradient(90deg,#0d2b0d,#1a3d1a);border-bottom:2px solid #2e7d32}
#facility-name{font-size:3vh;font-weight:bold;color:#a5d6a7;letter-spacing:.1em}
#clock{font-size:2.5vh;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
#main{flex:1;display:flex;flex-direction:column;padding:.6em;gap:.5em;overflow:hidden}
/* メイン大表示 */
#main-block{background:rgba(255,255,255,.05);border-radius:.6em;padding:.6em;flex-shrink:0}
.main-top{display:flex;justify-content:space-between;align-items:flex-start}
#main-name{font-size:2.2vh;color:rgba(255,255,255,.6)}
.ach{font-size:1.8vh;padding:.2em .6em;border-radius:.3em;font-weight:bold}
.ach-great{background:#1b5e20;color:#a5d6a7}
.ach-good{background:#33691e;color:#c5e1a5}
.ach-normal{background:#1a237e;color:#90caf9}
.ach-over{background:#b71c1c;color:#ef9a9a}
.main-val-row{display:flex;align-items:baseline;gap:.4em;margin:.2em 0}
#main-val{font-size:6vh;font-weight:bold;font-variant-numeric:tabular-nums}
#main-unit{font-size:2.5vh;color:rgba(255,255,255,.5)}
#main-target{font-size:1.8vh;color:rgba(255,255,255,.4)}
.main-meta{display:flex;gap:1em;margin-top:.2em}
.diff{font-size:2vh;font-weight:bold}
.diff-good{color:#66bb6a}
.diff-bad{color:#ef5350}
#main-note{font-size:1.6vh;color:rgba(255,255,255,.4)}
.bar-wrap{height:1.6vh;background:rgba(255,255,255,.1);border-radius:1em;overflow:hidden;margin:.4em 0}
.bar-fill{height:100%;border-radius:1em;transition:width .6s ease}
/* サブカード */
#sub-block{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(12em,1fr));gap:.5em;overflow:hidden;align-content:start}
.sub-card{background:rgba(255,255,255,.05);border-radius:.5em;padding:.5em}
.sub-name{font-size:1.8vh;color:rgba(255,255,255,.6);margin-bottom:.2em}
.sub-vals{display:flex;align-items:baseline;gap:.3em;margin-bottom:.2em}
.sub-cur{font-size:3vh;font-weight:bold;font-variant-numeric:tabular-nums}
.sub-unit{font-size:1.5vh;color:rgba(255,255,255,.4)}
.sub-diff{font-size:1.8vh;font-weight:bold;margin-left:auto}
.sub-bar-wrap{height:1.2vh;background:rgba(255,255,255,.1);border-radius:1em;overflow:hidden;margin:.2em 0}
.sub-bar{height:100%;border-radius:1em;transition:width .6s ease}
.sub-target{font-size:1.4vh;color:rgba(255,255,255,.3)}
</style>
<script src="app.js"></script>
</head>
<body>
<div id="header">
  <span id="facility-name">省エネモニター</span>
  <span id="clock">--:--</span>
</div>
<div id="main">
  <div id="main-block">
    <div class="main-top">
      <span id="main-name">-</span>
      <span class="ach" id="main-ach">-</span>
    </div>
    <div class="main-val-row">
      <span id="main-val">-</span>
      <span id="main-unit"></span>
    </div>
    <div class="bar-wrap"><div class="bar-fill" id="main-bar" style="width:0%"></div></div>
    <div class="main-meta">
      <span id="main-target">目標: -</span>
      <span class="diff" id="main-diff"></span>
      <span id="main-note"></span>
    </div>
  </div>
  <div id="sub-block"></div>
</div>
</body></html>
